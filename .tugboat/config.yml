services:
  # What to call the service hosting the site.
  suhumsci:
    # Use PHP 8 with Apache
    image: pookmish/drupal8ci:tugboat

    # Set this as the default service. This does a few things
    #   1. Clones the git repository into the service container
    #   2. Exposes port 80 to the Tugboat HTTP proxy
    #   3. Routes requests to the preview URL to this service
    default: true

    # Wait until the mysql service is done building
    depends: mysql
    aliases:
      - hs-colorful
      - hs-traditional
      - english
      - history
      - west

    # A set of commands to run while building this service
    commands:
      # Commands that set up the basic preview infrastructure
      init:
        - echo "========= INIT ========="
        # Install Node.js system-wide based on .nvmrc major version for consistent builds
        - export NODE_VERSION=$(cat .nvmrc | cut -d. -f1) && curl -fsSL https://deb.nodesource.com/setup_$NODE_VERSION.x | bash - && apt-get install -y nodejs
        # Symlink the tugboat directory to the docker image expected path.
        - rm -rf /var/www/localhost
        - ln -snf ${TUGBOAT_ROOT} /var/www/localhost
        - ln -s docroot htdocs

        # Install/update packages managed by composer, including drush
        - composer install --no-ansi

        # Init the settings files.
        - drush sws:multisite:settings
      update:
        - echo "========= UPDATE ========="
        # Composer install.
        - composer install --no-ansi
        # Copy ci.settings.php to all sites in the preview.
        - |
          IFS=,
          for alias in $TUGBOAT_DEFAULT_SERVICE_CONFIG_ALIASES; do
            site_id=$(echo $alias | sed "s/-/_/g")
            cp .tugboat/ci.settings.php docroot/sites/${site_id}/settings/
            sed -i "s/TUGBOAT_ALIAS/${site_id}/" docroot/sites/${site_id}/settings/ci.settings.php
          done
        # Install sites.
        - |
          IFS=,
          for alias in $TUGBOAT_DEFAULT_SERVICE_CONFIG_ALIASES; do
            site_id=$(echo $alias | sed "s/-/_/g")
            drush sql-sync @${site_id}.prod @${site_id}.local --create-db --structure-tables-key=lightweight --no-interaction --ansi
            drush @${site_id}.local sql-sanitize --no-interaction --ansi
            drush rsync @${site_id}.prod:%files @${site_id}.local:%files --ansi --no-interaction
            drush @${site_id}.local user:create ${PREVIEWSITE_USERNAME} --password=${PREVIEWSITE_PASSWORD} || true
            drush @${site_id}.local user:role:add administrator ${PREVIEWSITE_USERNAME} || true
          done
        - chown -R www-data:www-data ${TUGBOAT_ROOT}/docroot/sites/*/files
      build:
        - echo "========= BUILD ========="
        - composer install --no-ansi

        - |
          IFS=,
          for alias in $TUGBOAT_DEFAULT_SERVICE_CONFIG_ALIASES; do
            site_id=$(echo $alias | sed "s/-/_/g")
            drush @${site_id}.local cr
            drush @${site_id}.local deploy
          done

        # Build frontend assets. Prevent Puppeteer from downloading chrome because it's not needed here.
        - PUPPETEER_SKIP_DOWNLOAD=true npm run theme-build

    # Collection of urls to compare visual results.
    urls:
      hs-colorful:
        - /
        - /mixed-pages/mixed-page-raised-cards
        - /mixed-page-wells-raised-cards-full-width
        - /mixed-pages/mixed-page-wells-raised-cards-full-width-sidebar
        - /default-views/news
        - /default-views/events
        - /default-views/people
        - /components/hero-images-main-region/banner-images-partial-overlay-and-text
        - /components/hero-images-main-region/banner-images-text-box
        - /components/hero-images-full-width-region-and-main-region/tall-spotlights-classic
        - /components/text-area-typography
        - /components/collections/collections-postcards/vertical-cards
        - /components/collections/collections-postcards/horizontal-cards
        - /components/collections/collections-postcards/vertical-linked-cards
        - /components/collections/collections-postcards/vertical-button-cards
        - /components/collections/collections-postcards/vertical-cards/vertical-cards-raised-cards-uniform
        - /components/collections/collections-postcards/horizontal-cards/horizontal-cards-raised-cards-uniform
        - /components/collections/collections-postcards/vertical-linked-cards/vertical-linked-cards-uniform
        - /components/collections/collections-postcards/vertical-button-cards-0/vertical-button-cards-0
      hs-traditional:
        - /
        - /mixed-pages/mixed-page-raised-cards
        - /mixed-page-wells-raised-cards-full-width
        - /mixed-pages/mixed-page-wells-raised-cards-full-width-sidebar
        - /default-views/news
        - /default-views/events
        - /default-views/people
        - /components/hero-images-main-region/banner-images-partial-overlay-and-text
        - /components/hero-images-main-region/banner-images-text-box
        - /components/hero-images-full-width-region-and-main-region/tall-spotlights-classic
        - /components/text-area-typography
        - /test-empty-view-collection
        - /components/collections-0/collections-postcards/vertical-cards
        - /components/collections-0/collections-postcards/horizontal-cards
        - /components/collections-0/collections-postcards/vertical-linked-cards
        - /components/collections-0/collections-postcards/vertical-button-cards
        - /components/collections-0/collections-postcards/vertical-cards/vertical-cards-raised-cards-uniform
        - /components/collections-0/collections-postcards/horizontal-cards/horizontal-cards-raised-cards
        - /components/collections-0/collections-postcards/vertical-linked-cards/vertical-linked-cards-uniform
        - /components/collections-0/collections-postcards/vertical-button-cards/vertical-button-cards-uniform
  # What to call the service hosting MySQL. This name also acts as the
  # hostname to access the service by from the php service.
  mysql:
    # Use the latest available 8.x version of MySQL
    image: tugboatqa/mysql:8
    commands:
      init:
        # Increase the allowed packet size to 512MB.
        - mysql -e "SET GLOBAL max_allowed_packet=536870912;"
        # Ensure this packet size persists even if MySQL restarts.
        - echo "max_allowed_packet=536870912" >> /etc/mysql/conf.d/tugboat.cnf
      update:
        # Give the tugboat user access to the new databases.
        - mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'tugboat'; FLUSH PRIVILEGES;"
