uuid: ac085732-0045-4b4a-9b20-c9e6e6256dfe
langcode: en
status: false
dependencies:
  config:
    - core.entity_view_mode.node.search_index
    - field.storage.node.field_hs_training_audience
    - field.storage.node.field_hs_training_date_range
    - field.storage.node.field_hs_training_deliverymethod
    - field.storage.node.field_hs_training_location
    - field.storage.node.field_hs_training_name
    - field.storage.node.field_hs_training_nodate
    - field.storage.node.field_hs_training_product
    - field.storage.node.field_hs_training_provider
    - field.storage.node.field_hs_training_sourcesite
    - field.storage.node.field_hs_training_unit
    - search_api.server.hs_algolia_federated
  module:
    - node
    - taxonomy
id: hs_algolia_trainings
name: 'Algolia Trainings'
description: 'Public Training content written into the index shared by every site in the Training Hub.'
read_only: false
field_settings:
  audience:
    label: Audience
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_audience:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_audience
      module:
        - taxonomy
  date_end:
    label: 'End Date'
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_date_range:end_value'
    type: date
    dependencies:
      config:
        - field.storage.node.field_hs_training_date_range
  date_start:
    label: 'Start Date'
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_date_range:value'
    type: date
    dependencies:
      config:
        - field.storage.node.field_hs_training_date_range
  delivery_method:
    label: 'Delivery Method'
    datasource_id: 'entity:node'
    property_path: field_hs_training_deliverymethod
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_deliverymethod
  html:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: string
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          hs_training: search_index
  location:
    label: Location
    datasource_id: 'entity:node'
    property_path: field_hs_training_location
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_location
  nodate:
    label: 'No Date'
    datasource_id: 'entity:node'
    property_path: field_hs_training_nodate
    type: boolean
    dependencies:
      config:
        - field.storage.node.field_hs_training_nodate
  product:
    label: Product
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_product:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_product
      module:
        - taxonomy
  provider:
    label: Provider
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_provider:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_provider
      module:
        - taxonomy
  site_name:
    label: 'Site Name'
    property_path: custom_value
    type: string
    configuration:
      value: '[site:name]'
  sourcesite:
    label: 'Source Site'
    datasource_id: 'entity:node'
    property_path: field_hs_training_sourcesite
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_sourcesite
  summary:
    label: Summary
    property_path: custom_value
    type: string
    configuration:
      value: '[node:summary]'
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: string
    dependencies:
      module:
        - node
  training_name:
    label: 'Training Name'
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_name:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_name
      module:
        - taxonomy
  unit:
    label: Unit
    datasource_id: 'entity:node'
    property_path: 'field_hs_training_unit:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_hs_training_unit
      module:
        - taxonomy
  url:
    label: 'Page URL'
    property_path: custom_value
    type: string
    configuration:
      value: '[node:url:absolute]'
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - hs_training
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_status: {  }
  entity_type: {  }
  html_filter:
    weights:
      preprocess_index: -15
    all_fields: true
    fields:
      - audience
      - delivery_method
      - html
      - location
      - product
      - provider
      - site_name
      - sourcesite
      - summary
      - title
      - training_name
      - unit
      - url
    title: false
    alt: false
    tags: {  }
  language_with_fallback: {  }
  rendered_item: {  }
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 200
  delete_on_fail: false
  index_directly: false
  track_changes_in_references: true
  algolia_index_name: ''
  algolia_index_batch_deletion: '1'
  object_id_field: uuid
server: hs_algolia_federated
