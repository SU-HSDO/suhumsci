hs_algolia.settings:
  type: config_object
  label: 'Algolia search settings'
  mapping:
    application_id:
      type: string
      label: 'Algolia application ID'
    api_key:
      type: string
      label: 'ID of the key entity holding the Algolia write API key'
    index_name:
      type: string
      label: 'Algolia index name'
    search_enabled:
      type: boolean
      label: 'Whether the Algolia search interface replaces the Drupal search page'
    search_api_key:
      type: string
      label: 'Algolia search-only API key, sent to the browser'
